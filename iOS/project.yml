# Xcode project for the iPhone app. Generate it with `xcodegen` in this folder,
# or run ../scripts/run-ios.sh.
name: AgentTerm
options:
  bundleIdPrefix: com.manhpham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The version is the one in ../VERSION, which the Mac app is built from too.
  preGenCommand: printf 'MARKETING_VERSION = %s\n' "$(tr -d '[:space:]' < ../VERSION)" > Version.xcconfig
packages:
  AgentTerm:
    path: ..
targets:
  AgentTerm:
    type: application
    platform: iOS
    sources:
      - AgentTerm
      - Shared
    dependencies:
      # The Live Activity (#24), embedded in the app.
      - target: AgentTermLiveActivity
      - package: AgentTerm
        product: AgentTermProtocol
      - package: AgentTerm
        product: AgentTermClient
      - package: AgentTerm
        product: AgentTermTerminal
      - package: AgentTerm
        product: AgentTermEditor
      - package: AgentTerm
        product: AgentTermTelemetry
      - package: AgentTerm
        product: AgentTermFirebase
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    settings:
      base:
        PRODUCT_NAME: AgentTerm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Firebase's Objective-C categories are only found with this.
        OTHER_LDFLAGS: $(inherited) -ObjC
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      # A build made on a developer's machine is an app of its own next to the
      # one from TestFlight: its own identifier, name and pairing link scheme.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm.dev
          APP_DISPLAY_NAME: AgentTerm Dev
          APP_LINK_SCHEME: agentterm-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm
          APP_DISPLAY_NAME: AgentTerm
          APP_LINK_SCHEME: agentterm
    info:
      path: AgentTerm/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Firebase collects nothing by itself: the app switches each kind of
        # report on only when the user's choices allow it.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: AgentTerm uses the camera to scan the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: AgentTerm connects to the AgentTerm host running on your Mac.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.manhpham.agentterm.pair
            CFBundleURLSchemes:
              - $(APP_LINK_SCHEME)
  # The Live Activity of the agents on a Mac (#24): a widget extension, with
  # an identifier of its own under the app's.
  AgentTermLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - AgentTermLiveActivity
      - Shared
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    settings:
      base:
        PRODUCT_NAME: AgentTermLiveActivity
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm.dev.LiveActivity
          APP_LINK_SCHEME: agentterm-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm.LiveActivity
          APP_LINK_SCHEME: agentterm
    info:
      path: AgentTermLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: AgentTerm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppLinkScheme: $(APP_LINK_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AgentTermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AgentTermUITests
    dependencies:
      - target: AgentTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  AgentTerm:
    build:
      targets:
        AgentTerm: all
        AgentTermUITests: [test]
    test:
      targets:
        - AgentTermUITests
