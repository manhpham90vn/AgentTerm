# Xcode project for the iPhone app. Generate it with `xcodegen` in this folder,
# or run ../scripts/run-ios.sh.
name: Agentty
options:
  bundleIdPrefix: click.manhdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Agentty:
    path: ..
targets:
  Agentty:
    type: application
    platform: iOS
    sources:
      - Agentty
    dependencies:
      - package: Agentty
        product: AgenttyProtocol
      - package: Agentty
        product: AgenttyClient
      - package: Agentty
        product: AgenttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: click.manhdev.agentty.ios
        PRODUCT_NAME: Agentty
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Agentty/Info.plist
      properties:
        CFBundleDisplayName: Agentty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Agentty uses the camera to scan the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: Agentty connects to the Agentty host running on your Mac.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: click.manhdev.agentty.pair
            CFBundleURLSchemes:
              - agentty
  AgenttyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AgenttyUITests
    dependencies:
      - target: Agentty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: click.manhdev.agentty.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Agentty:
    build:
      targets:
        Agentty: all
        AgenttyUITests: [test]
    test:
      targets:
        - AgenttyUITests
