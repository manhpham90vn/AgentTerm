# Xcode project for the iPhone app. Generate it with `xcodegen` in this folder,
# or run ../scripts/run-ios.sh.
name: AgentTerm
options:
  bundleIdPrefix: com.manhpham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AgentTerm:
    path: ..
targets:
  AgentTerm:
    type: application
    platform: iOS
    sources:
      - AgentTerm
    dependencies:
      - package: AgentTerm
        product: AgentTermProtocol
      - package: AgentTerm
        product: AgentTermClient
      - package: AgentTerm
        product: AgentTermTerminal
      - package: AgentTerm
        product: AgentTermEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm
        PRODUCT_NAME: AgentTerm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: AgentTerm/Info.plist
      properties:
        CFBundleDisplayName: AgentTerm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: AgentTerm uses the camera to scan the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: AgentTerm connects to the AgentTerm host running on your Mac.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.manhpham.agentterm.pair
            CFBundleURLSchemes:
              - agentterm
  AgentTermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AgentTermUITests
    dependencies:
      - target: AgentTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manhpham.agentterm.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  AgentTerm:
    build:
      targets:
        AgentTerm: all
        AgentTermUITests: [test]
    test:
      targets:
        - AgentTermUITests
