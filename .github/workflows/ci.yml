name: CI

# Checks the code's formatting, builds the package and runs its tests on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_VERSION: "27.0"  # keep in sync with release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # The same Xcode as local development, on the `xcode-27` runner.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # Formatting and style, with the swift-format that comes with Xcode and
      # the settings in .swift-format. `make format` fixes what it reports.
      - name: Lint
        run: make lint
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
