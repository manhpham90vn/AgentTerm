name: Store listing

# Sends the App Store listing in fastlane/metadata to App Store Connect, and
# optionally the screenshots in fastlane/screenshots. Run by hand: it changes
# what the store shows for the version being prepared. Nothing is submitted
# for review. See docs/RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Also replace the screenshots"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

concurrency:
  group: metadata
  cancel-in-progress: false

jobs:
  app-store:
    name: App Store listing
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install fastlane
        run: command -v fastlane >/dev/null || brew install fastlane

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"

      - name: Send the listing
        env:
          # The contact for App Review is sent only when this is set.
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          fastlane ios metadata

      - name: Send the screenshots
        if: inputs.screenshots
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          fastlane ios screenshots

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
