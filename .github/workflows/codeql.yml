name: CodeQL

# Static analysis of this repository's code. It replaces GitHub's "default
# setup", which cannot leave the dependencies out: it reported findings in
# a dependency's build plugin under .build/checkouts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  XCODE_VERSION: "27.0"  # keep in sync with ci.yml

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflows, the fastlane lanes and the small C target need no build.
  scripts:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [actions, ruby, c-cpp]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Swift is analyzed while it is built. CodeQL builds it itself, as
  # GitHub's default setup did: a `swift build` step of our own could not
  # start the package manifest under CodeQL's tracing ("Bad CPU type in
  # executable"). The dependencies land in .build inside the checkout that
  # way, and the config file leaves that folder out of the results.
  swift:
    name: swift
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # CodeQL's build tracer on macOS is an Intel program; without Rosetta
      # the processes it starts fail with "Bad CPU type in executable".
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: autobuild
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
