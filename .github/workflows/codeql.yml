name: CodeQL

# Static analysis of this repository's code, in place of GitHub's "default
# setup". That one builds everything while it watches the compiler, the
# dependencies too, which takes a quarter of an hour or more for every push.
#
# Here what was built is kept from one run to the next. CodeQL only looks
# at what is compiled while it watches, and only this repository's own
# sources are newer than what was kept: so the dependencies are neither
# built again nor looked at, and a run compiles this repository's code only.
#
# Building the dependencies first without CodeQL does not help: under its
# tracer the compiler is a copy in another place, and SwiftPM takes nothing
# built by the real one as up to date. What is kept has to come from a
# build that was watched.
#
# A trial: it runs for pushes to this branch only and uploads nothing, so
# it can run next to the default setup until it is known to work.

on:
  push:
    branches: [ci/codeql-trial]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift
    # The runner the default setup analyzes Swift on. On xcode-27, with
    # Xcode 27, SwiftPM could not start the package manifest under CodeQL's
    # tracer ("Bad CPU type in executable").
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Say which tools these are
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      # The build folder of the last watched build, and what SwiftPM
      # remembers of the packages' manifests, which it otherwise works out
      # again one by one.
      - name: Restore what the last watched build left
        id: kept
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: codeql-watched-2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            codeql-watched-${{ runner.os }}-${{ runner.arch }}-

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      # With nothing kept, this builds everything, once. With the build
      # folder restored, only this repository's sources are newer than
      # what is in it.
      # SwiftPM keeps what it worked out of each package's manifest, but
      # only for the same environment: with a run's own identifiers in it
      # (the run's number, the commit) nothing kept is ever found again,
      # and every manifest is compiled anew under the tracer. So the build
      # gets an environment that is the same from run to run: the tools'
      # paths, and what CodeQL's tracer needs.
      - name: Build, watched
        shell: bash
        run: |
          find Sources -type f \( -name '*.swift' -o -name '*.c' -o -name '*.h' \) -exec touch {} +
          keep=(PATH="$PATH" HOME="$HOME" USER="$USER" TMPDIR="${TMPDIR:-/tmp}")
          while IFS='=' read -r name value; do
            case "$name" in
              CODEQL_ACTION_JOB_RUN_UUID|CODEQL_WORKFLOW_STARTED_AT) ;;
              CODEQL_*|SEMMLE_*|LGTM_*|DYLD_INSERT_LIBRARIES|DEVELOPER_DIR|MD_APPLE_SDK_ROOT) keep+=("$name=$value") ;;
            esac
          done < <(env | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | grep -v $'\n')
          echo "The build's environment has ${#keep[@]} variables."
          env -i "${keep[@]}" swift build 2>&1 | grep --line-buffered -E "Compiling|Emitting|Linking|Build complete|error|Planning|Building for" | awk 'NR % 10 == 1 { print; fflush() }'

      # Kept also when the analysis fails: the build is what took the time.
      - name: Keep what was built
        if: always() && steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: codeql-watched-2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
          upload: never
