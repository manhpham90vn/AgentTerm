name: Release

# Push a tag like v0.2.0, or run this by hand with a version, to release:
#   - the Mac app, signed with Developer ID, notarized, as a disk image on a GitHub release;
#   - the iPhone app, uploaded to TestFlight.
# Both jobs run the fastlane lanes of fastlane/Fastfile. See docs/RELEASE.md.
#
# Secrets (Settings → Secrets and variables → Actions). They are set from the private dotfiles
# repo with its scripts/sync-agentterm.sh, never typed in by hand:
#   APPLE_TEAM_ID                 the developer team
#   ASC_KEY_ID, ASC_ISSUER_ID     App Store Connect API key
#   ASC_KEY_P8                    the key file's text
#   MACOS_CERTIFICATE_P12         base64 of the "Developer ID Application" certificate (.p12)
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   MATCH_GIT_URL                 the fastlane match repository, as an https address
#   MATCH_PASSWORD                the passphrase match encrypts with
#   MATCH_GIT_BASIC_AUTHORIZATION base64 of "user:token" with read access to that repository
#   FIREBASE_CONFIG_MAC, FIREBASE_CONFIG_IOS
#                                 base64 of each app's GoogleService-Info.plist; without one
#                                 that app is built with no reporting service
#   HOMEBREW_TAP_TOKEN            token with contents write access to manhpham90vn/homebrew-tap;
#                                 without it the cask is not updated

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (e.g. 0.2.0)"
        required: true
      mac:
        description: "Release the Mac app"
        type: boolean
        default: true
      ios:
        description: "Upload the iPhone app to TestFlight"
        type: boolean
        default: true

permissions:
  contents: write

env:
  XCODE_VERSION: "27.0"  # keep in sync with ci.yml
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Mac app, notarized, on a GitHub release
    if: github.event_name == 'push' || inputs.mac
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      # The version has to be the one in VERSION (a -beta.N suffix is fine), and its
      # notes have to be written: the GitHub release and TestFlight show them.
      - name: Check the version and its release notes
        id: notes
        run: |
          scripts/check-version.sh "${{ steps.version.outputs.value }}"
          echo "path=$(scripts/check-release-notes.sh "${{ steps.version.outputs.value }}")" >> "$GITHUB_OUTPUT"

      - name: Install fastlane
        run: command -v fastlane >/dev/null || brew install fastlane

      - name: Write the signing files
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"

      # Without the secret the app is built with no reporting service and sends nothing.
      - name: Write the Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_MAC }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            umask 077
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > "$RUNNER_TEMP/firebase.plist"
            echo "FIREBASE_CONFIG_MAC=$RUNNER_TEMP/firebase.plist" >> "$GITHUB_ENV"
          fi

      - name: Build, sign and notarize
        env:
          VERSION: ${{ steps.version.outputs.value }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8" DEVELOPER_ID_P12="$RUNNER_TEMP/developer_id.p12"
          fastlane mac release
          cd dist && shasum -a 256 "AgentTerm-$VERSION.dmg" > "AgentTerm-$VERSION.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: AgentTerm ${{ steps.version.outputs.value }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/AgentTerm-${{ steps.version.outputs.value }}.dmg
            dist/AgentTerm-${{ steps.version.outputs.value }}.sha256

      # So "brew install --cask manhpham90vn/tap/agentterm" gets this version.
      - name: Update the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/publish-homebrew.sh "${{ steps.version.outputs.value }}"

      - name: Remove the signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/firebase.plist"

  ios:
    name: iPhone app to TestFlight
    if: github.event_name == 'push' || inputs.ios
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          # TestFlight takes numbers only: 0.2.0-beta.1 is uploaded as 0.2.0.
          echo "value=${v%%-*}" >> "$GITHUB_OUTPUT"

      # The version has to be the one in VERSION (a -beta.N suffix is fine), and its
      # notes have to be written: the GitHub release and TestFlight show them.
      - name: Check the version and its release notes
        id: notes
        run: |
          scripts/check-version.sh "${{ steps.version.outputs.value }}"
          echo "path=$(scripts/check-release-notes.sh "${{ steps.version.outputs.value }}")" >> "$GITHUB_OUTPUT"

      - name: Install fastlane and XcodeGen
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"

      # Without the secret the app is built with no reporting service and sends nothing.
      - name: Write the Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_IOS }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            umask 077
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > "$RUNNER_TEMP/firebase.plist"
            echo "FIREBASE_CONFIG_IOS=$RUNNER_TEMP/firebase.plist" >> "$GITHUB_ENV"
          fi

      - name: Build and upload
        env:
          VERSION: ${{ steps.version.outputs.value }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          fastlane ios beta

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/firebase.plist"
